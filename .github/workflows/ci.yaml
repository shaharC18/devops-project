name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Build and start the app
        run: docker compose up -d --build --wait

      - name: Check the home page
        run: curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8000/

      - name: Add a task
        run: curl --fail -X POST "http://localhost:8000/tasks?title=from-ci"

      - name: List tasks
        run: curl --fail http://localhost:8000/tasks

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the image
        run: docker build -t ghcr.io/shaharc18/tasks-api:latest -t ghcr.io/shaharc18/tasks-api:${{ github.sha }} .

      - name: Push the image
        run: docker push --all-tags ghcr.io/shaharc18/tasks-api
